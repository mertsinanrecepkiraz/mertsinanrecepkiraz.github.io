<div class="profile-card reference-profile">
<a href="{{ '/about' | relative_url }}">
<img src="{{ site.photo | prepend: '/images/' | relative_url }}" class="profile-photo" alt="{{ site.name }}" width="300" height="300" fetchpriority="high">
</a>
<p class="profile-name">{{ site.short_name | default: site.name }}</p>
<p class="profile-title">{{ site.title }}</p>
<p class="profile-institution">{{ site.institution }}</p>
<div class="profile-links social-strip">
<a href="mailto:{{ site.email }}" class="social-hotspot social-email" title="Email" aria-label="Email"></a>
<a href="{{ site.links.google_scholar }}" class="social-hotspot social-scholar" title="Google Scholar" aria-label="Google Scholar"></a>
<a href="{{ site.links.github }}" class="social-hotspot social-github" title="GitHub" aria-label="GitHub"></a>
<a href="{{ site.links.linkedin }}" class="social-hotspot social-linkedin" title="LinkedIn" aria-label="LinkedIn"></a>
</div>
</div>

<div class="section-card reference-news">
<h2>News</h2>
<div class="news-timeline">
{% for article in site.data.news limit:3 %}
<div class="news-item">
<div class="news-date">{{ article.date }}</div>
<div class="news-headline">{{ article.headline }}</div>
</div>
{% endfor %}
</div>
<p style="margin-top: var(--space-4);"><a href="{{ '/allnews.html' | relative_url }}">See all news &rarr;</a></p>
</div>
